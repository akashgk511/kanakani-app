services:
  db:
    image: postgres:15-alpine
    container_name: kanakani-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: kanakani
      POSTGRES_USER: kanakani
      POSTGRES_PASSWORD: ${KANAKANI_DB_PASSWORD:?Set KANAKANI_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - kanakani_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kanakani -d kanakani"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  kanakani_pgdata:
